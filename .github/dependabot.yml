# Keeps the SHA-pinned actions and the digest-pinned base images current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Node majors are a deliberate move (the runtime image copies only the
    # libraries node needs, and each major can need more), so stay on the
    # current LTS line and take its patch and digest updates.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      base-images:
        patterns: ['*']

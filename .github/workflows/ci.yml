name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot
# keeps both up to date.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: murmur:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to start and serve the app, not just build. No Hermes is
      # needed for that: /healthz and the SPA are Murmur's own.
      - name: Smoke test
        run: |
          docker run -d --name murmur -p 3000:3000 murmur:ci
          for i in $(seq 30); do
            curl -fsS http://localhost:3000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:3000/manifest.webmanifest
          test "$(docker exec murmur stat -c '%a %u' /data)" = '700 1000'
      - if: failure()
        run: docker logs murmur

  # Murmur's expectations of Hermes, checked against the Hermes it ships
  # (test/contract). A fake model stands in for a real one, so no key is needed.
  hermes-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contract
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-contract-logs
          path: test-results/contract/

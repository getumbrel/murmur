name: Security

# Is anything Murmur ships missing a published fix? scripts/security.ts checks
# Node in the image on every platform it's published for, the npm packages that
# ship (Electron included), and that Electron's major still gets fixes; Trivy
# checks the image's own Alpine packages. This runs on every push to master, so
# master turns red as soon as a fix comes out, and release.yml and desktop.yml
# run it before they publish anything, so a release can't go out without one.
# It never changes a version itself.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - scripts/security.ts
      - .github/workflows/security.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs (the tag is in the comment).
jobs:
  shipped:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No npm ci: the script has no dependencies, and npm audit reads the lockfile.
      - run: npm run security

  # A high or critical issue in the image's Alpine packages that Alpine 3.24 has
  # a fix for fails it; the fix is a newer digest of alpine:3.24. Trivy doesn't
  # see the node binary the image copies in, which the job above checks.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: murmur:security
          cache-from: type=gha
      - name: Scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 murmur:security

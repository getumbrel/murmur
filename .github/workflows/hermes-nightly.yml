name: Hermes nightly

# The contract suite (test/contract) against Hermes's newest release, so a
# change that would break Murmur shows up before the pinned Hermes is bumped.
# Run it by hand to try any image first, such as an Umbrel build to pin next.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: Hermes image to test
        default: nousresearch/hermes-agent:latest

permissions:
  contents: read

jobs:
  hermes-contract:
    runs-on: ubuntu-latest
    env:
      HERMES_IMAGE: ${{ inputs.image || 'nousresearch/hermes-agent:latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contract
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hermes-contract-logs
          path: test-results/contract/

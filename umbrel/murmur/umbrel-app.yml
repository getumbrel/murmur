releaseNotes: >-
  This is the first release of Murmur, a calm and beautiful way to talk to your Hermes agents from your phone or computer.


  What's included:
    - **Agents and templates** - Start from a ready-made helper like a Researcher, Writer, Planner or Chef, or make your own. Give each agent a name, a colour and the model it thinks with.
    - **Groups** - Bring two to six agents into one chat. They take turns, build on each other's ideas and answer when you mention them.
    - **See the work** - Follow along as your agents search, read and run things, and say yes before anything important happens.
    - **More than one Hermes** - Add a Hermes running on another computer next to the one on your Umbrel, and switch between them in a tap.
    - **Voice** - Tap the mic to talk instead of type, and have any reply read aloud.
    - **Each agent's page** - Set up routines that run on a schedule, see what your agent remembers, and connect it to Telegram.


  About voice: browsers only let a web page use your microphone over a secure (https) connection. If you open Murmur at a plain http address, like http://umbrel.local, the mic button stays hidden. Everything else works the same, including read aloud.
submitter: Umbrel

manifestVersion: 1.1
id: murmur
category: ai
name: Murmur
version: "0.1.0"
tagline: A beautiful way to use Hermes
description: >-
  Murmur is a calm, beautiful home for your Hermes agents. Open it on your phone or your computer and just talk.


  Every agent is a little character with its own name, colour and personality. Chat with one, or bring a few together in a group. Replies appear as they're written, and you can see what your agents are doing as they work — searching the web, reading a file, running a command — and approve anything important with a single tap.


  Murmur works with the Hermes Agent app you already have. Your agents, chats and models stay right where they are on your Umbrel, so anything you start in Murmur shows up in Hermes, and the other way around.


  Add Murmur to your home screen and it feels just like a native app.


  ## Highlights

    - **Talk to your agents** - Quick, calm chats that look great on any screen, in light or dark.

    - **Groups** - Put several agents in one conversation and let them work together.

    - **See what's happening** - Follow along as your agents work, and say yes before anything important happens.

    - **Make agents your own** - Give each agent a name, a colour and the model it thinks with.

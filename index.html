<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Numbers in the interface aren't phone numbers. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Murmur" />
    <meta name="application-name" content="Murmur" />
    <meta name="description" content="A beautiful way to use Hermes" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>Murmur</title>
    <!-- Appearance (Settings): a forced light or dark is on <html> before anything
         paints. Keep in step with src/features/settings/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('murmur:theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#0b0b0c' : '#fbfbfa' })
          document.querySelector('meta[name="color-scheme"]').content = t
        }
      } catch (e) {}
    </script>
    <!-- The first frame is already the app's colour, so the splash fades in from nothing. -->
    <style>
      html { background: #fbfbfa }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0b0b0c } }
      html[data-theme='dark'] { background: #0b0b0c }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
